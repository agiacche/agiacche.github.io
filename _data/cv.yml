# Canonical CV data.
#
# This is the single source of truth for the "static" parts of the CV
# (employment history, education, honours/funding) that don't already
# live in their own Jekyll collection.
#
# Everything else on the CV page (/cv/) is generated straight from its
# own collection and does NOT need to be duplicated here:
#   - Publications  -> _publications/  (site.publications)
#   - Teaching       -> _teaching/ and _teaching_misc/
#   - Organised events -> _events/
#   - Current position / contact / links -> _config.yml (site.author)
#
# To update the CV: edit this file (for employment/education/honours)
# or add a new file to the relevant collection (for publications,
# teaching, talks, events). Both the /cv/ page and the downloadable
# CV PDF are generated from this same data, so there is nothing else
# to keep in sync. See CONTRIBUTING.md for details.

