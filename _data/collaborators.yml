# `sort_key` is the surname (or the name segment to alphabetise by) in
# plain ASCII lowercase - kept separate from `name` because Liquid's
# `sort` filter sorts by first name otherwise, and because a couple of
# entries (multi-word or accented surnames) need an explicit key to
# land in the right alphabetical slot.
